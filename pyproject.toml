[project]
name = "patterns"
version = "0.0.1"
description = "Репозиторий с шаблонами паттернов"
readme = "README.md"
authors = [
    { name = "Anton", email = "random_email@mail.ru" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
patterns = "patterns:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["patterns"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
test = [
    "pytest>=9.2.0",
]

[tool.ruff]
line-length = 88
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "migrations",
    "test",
    ".ruff_cache",
]

[tool.ruff.lint]
select = [
    "E",
    "E501",
    "F",
]

[tool.ruff.format]
docstring-code-format = true
